# CI do cockpit-dev.
#
# Três garantias independentes, cada uma no seu job, para que o relatório da
# PR diga qual delas barrou (User Story 3; contracts/cli.md §Workflow de CI;
# plan.md §CI do cockpit):
#   - shellcheck  → portabilidade/qualidade de shell de todo .sh (FR-017)
#   - agnostico   → scripts/verificar-agnostico.sh (FR-018)
#   - segredos    → gitleaks binário, dir . --redact -v (FR-019, FR-020, FR-021)
#
# Gatilho: pull_request e push em main — nunca pull_request_target
# (CICD-SEC-4, plan.md §Superfície de Segurança: pull_request roda o código
# do fork com token somente-leitura e sem segredos).
#
# Permissão mínima: contents: read no nível do workflow (CICD-SEC-2).
#
# Actions de terceiro fixadas por SHA de commit, nunca tag móvel (A03,
# CICD-SEC-8) — fonte de cada pin abaixo, lida via context-mode (Princípio V):
#   actions/checkout@v7.0.1 → SHA 3d3c42e5aac5ba805825da76410c181273ba90b1,
#   confirmado em https://api.github.com/repos/actions/checkout/releases/latest
#   e https://api.github.com/repos/actions/checkout/commits/v7.0.1
#   (cross-checado com https://github.com/actions/checkout/releases).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Rodar shellcheck em todo .sh versionado
        run: |
          set -euo pipefail
          # -z/-0: caminho com espaço não é partido; -r: lista vazia não roda;
          # --: arquivo cujo nome começa com hífen não vira opção.
          git ls-files -z '*.sh' | xargs -0 -r shellcheck --

  agnostico:
    name: agnostico
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar agnosticismo (FR-018)
        run: ./scripts/verificar-agnostico.sh

  segredos:
    name: segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: o passo "histórico da PR" abaixo varre os
          # patches do range base..head; o checkout raso (default 1) não os
          # teria (input fetch-depth, README de actions/checkout).
          fetch-depth: 0

      # Binário baixado e conferido no job — nunca a Action de terceiro
      # (research Decision 15: gitleaks/gitleaks-action exige
      # GITLEAKS_LICENSE em repositório de organização e não é mais MIT).
      # Versão e nome de asset confirmados via context-mode em
      # https://api.github.com/repos/gitleaks/gitleaks/releases/latest e
      # https://github.com/gitleaks/gitleaks/releases (linux_x64, não
      # linux_amd64). O SHA256 abaixo é o literal de
      # gitleaks_8.30.1_checksums.txt publicado na release v8.30.1 — fixado
      # aqui, e não lido da release na hora, para que a troca do asset por
      # quem controla a release seja detectada (review rodada 1). Sobe junto
      # com VERSAO a cada bump. Download e extração em $RUNNER_TEMP: nada que
      # o job baixa entra no diretório varrido.
      - name: Baixar e conferir gitleaks
        run: |
          set -euo pipefail
          VERSAO="8.30.1"
          SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          TARBALL="gitleaks_${VERSAO}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          chmod +x gitleaks

      # --redact é obrigatória (não cosmética, FR-019): sem ela, o console
      # imprime o campo Secret: com o valor achado, e barrar um vazamento
      # publicaria o segredo no log da PR. -v é igualmente obrigatória: sem
      # ela o gitleaks só imprime "leaks found: N", sem File:/Line:, e a PR
      # barrada não diz onde está o segredo (review rodada 1; a spec exige
      # arquivo e linha). Sem -c/-i: .gitleaks.toml e .gitleaksignore da raiz
      # são lidos por default (FR-021 — exceção só existe versionada e
      # revisável no diff da PR); o .gitleaks.toml precisa do bloco
      # [extend] useDefault = true, senão SUBSTITUI o conjunto de regras.
      - name: Rodar gitleaks na árvore (FR-019, FR-020, FR-021)
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact -v

      # A árvore final não basta: segredo que entrou num commit e saiu no
      # seguinte passa no `dir .` e entra no histórico de main após o merge
      # (review rodada 2, decisão do owner). No pull_request, varre também os
      # patches do range base..head — forma oficial: `gitleaks git
      # --log-opts="<A>..<B>"` (README, subcomando git). O nome da base entra
      # por env, não interpolado no script (CICD-SEC-4).
      - name: Rodar gitleaks no histórico da PR (FR-019)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact -v --log-opts="origin/${BASE_REF}..HEAD"
